[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.1.0"
description = "Local-first BOLA authorization testing for APIs used by AI agents"
requires-python = ">=3.11"
dependencies = ["Flask==3.1.1"]

[project.optional-dependencies]
test = ["pytest==8.4.1"]

[project.scripts]
agentshield = "agentshield.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
